# deepseek-harness-tui bundle patch: an interactive terminal UI riding over dsh-base.
# Two rows, mirroring the headless bundle's split:
#   tui-startup parses this app's own command line (the launcher only knows
#   --profile/--patch and the web/plugin subcommands) and provides the parsed
#   values as the `tuiStartup` service; tui-runner consumes that service and
#   owns the pi-tui render loop, the agent session, and the approval answerer.

# Host-layer capability rows mirrored from the web-app bundle so the TUI
# profile matches `dsh --profile web` feature-for-feature (browser/HTTP-only
# rows — webserver, api-gateway, directory-picker, client roster — excluded).
- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # `@deepseek-ai/dsh-session-log-export` is deliberately NOT mounted: its host
    # half only returns "Session log download requested." and the ZIP comes from
    # the ApiProxy endpoint a browser plugin fetches, neither of which exists in
    # a terminal. The TUI registers its own `/export`, which writes the log to a
    # file; two `/export` registrations in one profile fail the second one loud.

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # Workspace registry: durable workspace records and session-to-workspace
    # accounting. The TUI creates sessions in the current working directory;
    # this service lets it attach those sessions to registered workspaces so
    # they appear in the Web GUI's workspace panels rather than as "Ungrouped".
    - id: workspace-registry
      name: '@deepseek-ai/dsh-workspace'

    # The preset roster, configured exactly as the web-app bundle configures it.
    # The agent-plane disables BELOW are the other half of this row: without
    # them the base's process-global tools stack under every preset and the
    # roster only ever adds to the standard composition instead of selecting.
    # Only `default` is stated here: the SHIPPED root (`config/agent-presets/`,
    # `system` trust) sits beside the installed app's own config, so the launcher
    # patches it into whichever profile carries a row with THIS id — which is why
    # the id must stay `agent-presets`. The writable root under the harness home
    # is `dsh-agent-presets`' own `includeUserRoot` default.
    #
    # Mounting this row is what makes every agent this bundle opens go through
    # `AgentPresets.mount()` in its creation setup: the plugin warns on any agent
    # published without joining a preset (see its `agent/created` listener), so
    # the boot path in `src/index.ts` composes create AND resume.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

# ── surface values the base deliberately omits (web-app parity) ─────────────

# The deployment persona, the same line the web-app bundle states. Presets
# shadow it with their own `dsh-persona` row; this host value is what a
# rosterless overlay of this profile would fall back to.
- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: tools
  config:
    # TEMPORARY workaround mirrored from the web-app bundle: DSH_TOOLS_MODE
    # (native|code|both) opts a whole dsh process into Code Mode; unset keeps
    # the schema default (native). The designed path is the `code` preset.
    mode: !!js process.env.DSH_TOOLS_MODE

# The permission preset table, with the one entry Shift+Tab needs: `auto-accept`
# is the workspace sandbox with the approval policy set to `never`, which is what
# Claude Code's "accept edits" mode is made of. `@deepseek-ai/dsh-permission-presets`
# fixes its table for the plugin's lifetime, so a named preset can only be added
# here, in the composition.
#
# Restated whole because a patch REPLACES a config key rather than merging into
# it (`applyEntryPatches`: `target[key] = value`) — the other three rows are the
# base bundle's own table, copied so this file is the whole truth about what
# `/permission` offers a terminal session. Order matters to the service: with no
# recorded selection it names the FIRST entry whose sandbox and approval both
# match, and the four bundles here are pairwise distinct, so the ambiguity never
# arises.
#
# `danger-full-access` stays in the table and out of the Shift+Tab cycle: a
# preset that turns the sandbox off is worth typing `/permission` for.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: read-only
        description: Read the workspace; every write or command asks first.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: workspace-write
        description: Write inside the workspace and permitted temporary directories; wider retries require approval.
      auto-accept:
        sandbox: workspace-write
        approval: never
        name: auto-accept
        description: Same workspace sandbox, but tool calls inside it run without asking.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: danger-full-access
        description: Full file access without approval prompts.

# ── the agent plane moves behind agent presets (web-app parity) ─────────────
#
# Every row below composes what ONE agent contributes to the host registries:
# its tools, its prompt sections, its delegation backends. The base keeps them
# for a preset-less single-session terminal; this bundle mounts the preset
# roster above, so — exactly as the web-app bundle does — each session mounts
# a preset instead, and these base rows are disabled so a preset SELECTS the
# agent plane rather than stacking on a process-global copy of `standard`.
#
# Disabling rather than deleting is deliberate: the base is shared, and a row
# absent from a surface overlay would silently reappear the day someone
# reorders the composition. What stays enabled is host-plane by the criteria
# the web-app patch records: `shell-env` (host injection), the `jobs`,
# `skill`, `goals`, and `subagents` registries plus `tool-subagent-report`
# (read across sessions or process-singletons), and the token meter.

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: tui-startup
      name: 'deepseek-harness-tui/startup'

    - id: tui-runner
      name: 'deepseek-harness-tui'
      inject: [tuiStartup]
